services:
  - type: web
    name: ai-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: HEALTH_SERVER_ENABLED
        value: "true"
      - key: RANDOM_REPLY_CHANCE
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TOKEN
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
